name: Deploy Mehewara (V2)

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://mehewara-v2-api-production.mehewara-site.workers.dev' }}

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          DEPLOY_BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Deploying branch: $DEPLOY_BRANCH"
          npx --yes wrangler pages deploy ./dist \
            --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mehewara-site' }}" \
            --branch "$DEPLOY_BRANCH"

